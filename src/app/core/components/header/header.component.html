<header class="header">
  <div class="header-container">
    <!-- Brand / Logo -->
    <a routerLink="/home" class="logo" (click)="closeMobileMenu()">
      <span class="logo-bracket">&lt;</span>
      <span class="logo-text">FullStackDev</span>
      <span class="logo-bracket"> /&gt;</span>
    </a>

    <!-- Navegación Escritorio -->
    <nav class="desktop-nav" aria-label="Navegación principal">
      <ul class="nav-list">
        @for (item of navItems; track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: item.path === '/home' }"
              class="nav-link"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <!-- Acciones (Conmutador de Tema + Menú Hamburguesa) -->
    <div class="header-actions">
      <button
        type="button"
        class="btn-icon"
        (click)="toggleTheme()"
        [attr.aria-label]="isDarkMode() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
      >
        {{ isDarkMode() ? '☀️' : '🌙' }}
      </button>

      <button
        type="button"
        class="hamburger-btn"
        [class.active]="isMobileMenuOpen()"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="isMobileMenuOpen()"
        aria-label="Abrir menú de navegación"
      >
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </div>
  </div>

  <!-- Menú Desplegable Móvil -->
  @if (isMobileMenuOpen()) {
    <nav class="mobile-nav" aria-label="Navegación móvil">
      <ul class="mobile-nav-list">
        @for (item of navItems; track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: item.path === '/home' }"
              class="mobile-nav-link"
              (click)="closeMobileMenu()"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>
  }
</header>
